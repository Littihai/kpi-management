name: Server package

# Push a tag like server-v1.1.0 to build helpdesk-server-1.1.0.zip (program + web app + SQL scripts + install.ps1)
# and attach it to a GitHub release. The desktop app has its own tags (v1.1.0), see desktop-release.yml.
on:
  push:
    tags: ['server-v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the package
        shell: pwsh
        run: ./deploy/build-package.ps1 -Version ($env:GITHUB_REF_NAME -replace '^server-v', '')

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/helpdesk-server-*.zip).FullName --title $env:GITHUB_REF_NAME --generate-notes
