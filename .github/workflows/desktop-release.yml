name: Desktop release

# Push a tag like v1.1.0 to build the Windows installer and publish it as a GitHub release.
# Installed apps pick it up through electron-updater.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Publish the built-in server into desktop/api
        working-directory: desktop
        run: npm run api

      - name: Build the web app into desktop/app
        working-directory: desktop
        run: npm run web

      - name: Set the package version from the tag (not committed)
        working-directory: desktop
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # electron-builder uploads its files in parallel and can end up creating two draft releases (one holding only
      # the .blockmap), which the updater cannot see. Build first, then publish once with the GitHub CLI.
      - name: Build the installer
        working-directory: desktop
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "desktop/dist/Helpdesk-Setup-${VERSION}.exe" \
            "desktop/dist/Helpdesk-Setup-${VERSION}.exe.blockmap" \
            desktop/dist/latest.yml \
            --title "$GITHUB_REF_NAME" --generate-notes
